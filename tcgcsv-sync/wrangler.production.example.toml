# Production TCGCSV Worker configuration.
# Copy this file to wrangler.production.toml and replace the database_id placeholder.
# Never point the production worker at pokemon-vip-members-staging.
name = "pokeprizepool-tcgcsv-sync"
main = "worker.js"
compatibility_date = "2026-10-19"

[triggers]
crons = ["*/1 * * * *", "0 21 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pokemon-vip-members"
database_id = "4427e96c-d1f1-4f42-b863-94e303a4b7d9"
