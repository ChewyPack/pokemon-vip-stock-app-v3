<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07194d">
<title>Order status | PokePrizePool</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css">
<style>body{background:#f5f8ff;color:#07194d;font-family:Nunito,system-ui,sans-serif}.order-wrap{width:min(760px,calc(100% - 28px));margin:30px auto 70px}.order-card{border:2px solid #07194d;border-radius:17px;background:#fff;padding:clamp(20px,4vw,34px);box-shadow:6px 6px 0 #07194d}.order-kicker{margin:0 0 5px;color:#174b9b;font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.order-card h1{font:clamp(2.5rem,7vw,3.5rem)/1 Bangers,cursive;margin:0 0 12px}.order-status{border-radius:10px;background:#edf3ff;padding:13px 14px;line-height:1.55;font-weight:800}.order-status[data-state="paid"]{background:#e4f8ed;color:#17623e}.order-status[data-state="review"],.order-status[data-state="failed"]{background:#fff2df;color:#805000}.order-status[data-state="expired"]{background:#f3f4f7;color:#626d82}.order-meta{color:#5f7195;font-size:.84rem;line-height:1.5;overflow-wrap:anywhere}.order-items{display:grid;gap:9px;margin:18px 0}.order-item{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #e7edf8;padding:10px 0}.order-item strong{overflow-wrap:anywhere}.order-total{display:flex;justify-content:space-between;gap:12px;padding-top:12px;border-top:2px solid #dfe7f5;font-size:1.1rem;font-weight:900}.order-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.order-actions a{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border:1px solid #17386c;border-radius:9px;color:#17386c;text-decoration:none;font-weight:900}.order-actions a.primary{background:#ffd21f}</style></head><body>
<div id="site-navigation"></div><main class="order-wrap"><section class="order-card"><p class="order-kicker">PokePrizePool Store</p><h1>Order status</h1><p id="order-status" class="order-status" role="status" aria-live="polite">Looking up your order…</p><p id="order-meta" class="order-meta"></p><div id="order-items" class="order-items"></div><div id="order-total" class="order-total" hidden><span>Total</span><strong></strong></div><div class="order-actions"><a class="primary" href="/store.html">Back to the store</a><a href="mailto:pokeprizepool@gmail.com">Contact support</a></div></section></main>
<script src="/js/ui/site-nav.js?v=20261025-shared-header-v2"></script><script>
(function(){const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),number=params.get('n')||'',token=params.get('t')||'',money=cents=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(cents||0)/100),safe=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tries=0;
function render(data){const state=data.paymentStatus||'pending',status=$('order-status');status.dataset.state=state;status.textContent=({pending:'Your order is saved. We’re waiting for Stripe to confirm payment; this page will check again automatically.',paid:'Payment confirmed — thank you for supporting PokePrizePool! Your order is being prepared.',review:'Payment was received but the order needs a manual inventory review. Please contact support before shipment.',expired:'This checkout expired before payment completed. Any reserved stock has been released.',failed:'Payment did not complete. The order reservation has been released.',refunded:'This order has been marked refunded.'})[state]||'Order status: '+state;
$('order-meta').textContent='Order '+data.orderNumber+' · Created '+new Date(data.createdAt).toLocaleString();
$('order-items').innerHTML=(data.items||[]).map(item=>'<div class="order-item"><span><strong>'+safe(item.name)+'</strong><br><span class="order-meta">Qty '+Number(item.quantity)+' · '+money(item.unit_price_cents)+' each</span></span><strong>'+money(item.line_total_cents)+'</strong></div>').join('');
const total=$('order-total');if(['paid','review','refunded'].includes(state)){total.hidden=false;total.querySelector('strong').textContent=money(data.totalCents);}else total.hidden=true;
}
async function load(){if(!number||!token){$('order-status').textContent='The order link is incomplete. Check the address or contact support.';$('order-status').dataset.state='failed';return;}
try{const response=await fetch('/api/store/order?n='+encodeURIComponent(number)+'&t='+encodeURIComponent(token),{credentials:'same-origin',cache:'no-store'}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'We could not locate this order.');render(data);if(data.paymentStatus==='pending'&&tries<12){tries++;setTimeout(load,4000);}}
catch(error){$('order-status').textContent=error.message||'We could not load your order.';$('order-status').dataset.state='failed';}}
load();})();
</script></body></html>
