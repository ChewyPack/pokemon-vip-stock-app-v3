<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07194d">
<title>Product | PokePrizePool Store</title>
<meta name="description" content="View product details in the official PokePrizePool store.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--st-navy:#07194d;--st-blue:#174b9b;--st-yellow:#ffd21f;--st-muted:#62749a;--st-line:#d9e3f4}
body{background:#f5f8ff;color:var(--st-navy);font-family:Nunito,system-ui,sans-serif}
.product-wrap{width:min(1120px,calc(100% - 28px));margin:22px auto 70px}
.product-back{display:inline-flex;margin:0 0 18px;color:var(--st-blue);font-weight:900;text-decoration:none}.product-back:hover{text-decoration:underline}
.product-panel{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(22px,4vw,48px);padding:clamp(16px,3vw,34px);border:1px solid var(--st-line);border-radius:18px;background:#fff;box-shadow:0 8px 28px #07194d0b}
.product-gallery{min-width:0}.product-main-image{min-height:360px;height:clamp(340px,45vw,540px);display:grid;place-items:center;padding:16px;border:1px solid #e5ebf7;border-radius:14px;background:radial-gradient(ellipse at center,#edf3ff,#fff 70%);cursor:zoom-in}
.product-main-image img{display:block;width:100%;height:100%;max-height:500px;object-fit:contain}.product-thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.product-thumb{width:76px;height:76px;border:1px solid var(--st-line);border-radius:9px;background:#fff;padding:5px;cursor:pointer}.product-thumb[aria-pressed=true]{border:2px solid var(--st-blue)}.product-thumb img{width:100%;height:100%;object-fit:contain}
.product-info{align-self:center}.product-kicker{margin:0 0 9px;color:var(--st-blue);font-size:.78rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.product-title{font:clamp(2.5rem,5vw,4rem)/1 Bangers,cursive;margin:0;color:var(--st-navy);overflow-wrap:anywhere}.product-price{font-size:1.8rem;font-weight:900;margin:16px 0 12px}.product-old-price{margin-left:8px;font-size:1rem;color:#8794ad;text-decoration:line-through}.product-status{display:inline-flex;padding:7px 11px;border-radius:999px;background:#fff3bc;color:#725400;font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.product-description{white-space:pre-wrap;line-height:1.75;color:#425678;margin:20px 0}.product-meta{display:grid;gap:9px;padding:16px 0;border-top:1px solid #edf1f8;border-bottom:1px solid #edf1f8;font-size:.9rem}.product-meta div{display:flex;gap:8px;flex-wrap:wrap}.product-meta strong{min-width:95px}
.product-buy{width:100%;min-height:48px;margin-top:18px;border:2px solid var(--st-navy);border-radius:10px;background:#e6eaf2;color:#8791a6;font:900 .98rem Nunito,system-ui,sans-serif;cursor:not-allowed}.product-note{font-size:.8rem;color:var(--st-muted);line-height:1.6}.product-variant-options{display:grid;gap:12px;margin:18px 0}.product-option-field{display:grid;gap:6px;font-size:.83rem;font-weight:900}.product-option-field select{width:100%;min-height:44px;border:1px solid #b9c9e6;border-radius:9px;padding:10px 12px;background:#fff;color:var(--st-navy);font:800 .9rem Nunito,system-ui,sans-serif}.product-message{padding:28px;border:1px solid var(--st-line);border-radius:14px;background:#fff;text-align:center;line-height:1.65}.product-lightbox{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:24px;background:#071022eF;cursor:zoom-out}.product-lightbox.open{display:flex}.product-lightbox img{max-width:min(100%,1100px);max-height:90vh;object-fit:contain}.product-lightbox button{position:absolute;top:18px;right:18px;border:0;border-radius:50%;width:42px;height:42px;background:#fff;color:var(--st-navy);font-size:1.5rem;cursor:pointer}
[hidden]{display:none!important}
@media(max-width:760px){.product-panel{grid-template-columns:1fr}.product-main-image{height:clamp(280px,75vw,440px);min-height:280px}.product-info{align-self:auto}}
</style>
</head>
<body>
<div id="site-navigation"></div>
<main class="product-wrap">
<a class="product-back" href="/store.html">← Back to the PokePrizePool Store</a>
<div id="product-status" class="product-message" role="status" aria-live="polite">Loading product details…</div>
<section id="product-panel" class="product-panel" hidden aria-labelledby="product-title">
<div class="product-gallery">
<button id="product-main-image" class="product-main-image" type="button" aria-label="Enlarge product image"></button>
<div id="product-thumbs" class="product-thumbs" aria-label="More product images"></div>
</div>
<div class="product-info">
<p class="product-kicker">Official PokePrizePool Store · Clothing & Collectibles</p>
<h1 id="product-title" class="product-title"></h1>
<div id="product-price" class="product-price"></div>
<span id="product-badge" class="product-status">Available</span>
<p id="product-description" class="product-description"></p>
<div id="product-meta" class="product-meta"></div>
<div id="product-variant-options" class="product-variant-options" hidden></div>
<button id="product-buy" class="product-buy" type="button">Add to Cart</button>
<p id="product-note" class="product-note">Choose your options, add the item to your cart, then send your order request through checkout.</p>
</div>
</section>
</main>
<div id="product-lightbox" class="product-lightbox" role="dialog" aria-modal="true" aria-label="Enlarged product image"><button id="product-lightbox-close" type="button" aria-label="Close enlarged image">×</button><img id="product-lightbox-image" alt=""></div>
<script src="/js/ui/site-nav.js?v=20261025-shared-header-v2"></script>
<script>
(function(){
 const $=id=>document.getElementById(id);
 const safe=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function productIsComingSoon(product){return !!(product&&product.comingSoon&&!product.manualOrderRequest);}
 const money=cents=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(cents||0)/100);
 const slug=new URLSearchParams(location.search).get('slug');
 let images=[],selectedProduct=null,selectedVariant=null;
 function availableVariants(product){
   return (Array.isArray(product.printifyVariants)?product.printifyVariants:[]).filter(v=>v&&v.enabled!==false&&v.isAvailable!==false&&Number.isInteger(Number(v.id))&&Number.isFinite(Number(v.priceCents)));
 }
 function selectCurrentVariant(){
   if(!selectedProduct||!selectedProduct.isPrintify)return;
   const variants=availableVariants(selectedProduct),root=$('product-variant-options'),optionSelects=Array.from(root.querySelectorAll('[data-printify-option]'));
   let matching=[];
   if(optionSelects.length){
     const values=optionSelects.map(select=>String(select.value));
     matching=variants.filter(v=>Array.isArray(v.optionIds)&&optionSelects.every(select=>String(v.optionIds[Number(select.dataset.printifyOption)]??'')===String(select.value)));
   }else{
     const variantSelect=root.querySelector('[data-printify-variant]');
     matching=variantSelect?variants.filter(v=>String(v.id)===String(variantSelect.value)):variants;
   }
   selectedVariant=matching[0]||null;
   if(selectedVariant){
     $('product-price').textContent=money(selectedVariant.priceCents);
     if(productIsComingSoon(selectedProduct)){
       $('product-buy').textContent='Currently Unavailable';
       $('product-buy').disabled=true;
       $('product-note').textContent='This product is not currently available to order. Please refresh the store or contact PokePrizePool.';
     }else{
       $('product-buy').textContent='Add to Cart';
       $('product-buy').disabled=false;
       $('product-note').textContent='Clothing/apparel is shipped sealed in packaging. Choose your size/color and add it to your cart. Checkout shows an estimated tax and total; confirm item availability and any separate shipping amount before sending payment.';
     }
   }else{
     $('product-price').textContent='Unavailable';
     $('product-buy').textContent='Unavailable';
     $('product-buy').disabled=true;
     $('product-note').textContent='That option combination is currently unavailable. Please choose another option.';
   }
 }
 function renderVariantOptions(product){
   const root=$('product-variant-options'),variants=availableVariants(product),options=Array.isArray(product.printifyOptions)?product.printifyOptions:[];
   selectedVariant=null;root.innerHTML='';
   if(!product.isPrintify)return;
   root.hidden=false;
   if(!variants.length){root.innerHTML='<p class="product-note">No variants are currently available.</p>';return;}
   const initial=variants[0];
   const usableOptions=options.map((option,optionIndex)=>({option,optionIndex})).filter(({option,optionIndex})=>option&&Array.isArray(option.values)&&option.values.some(value=>value&&variants.some(v=>Array.isArray(v.optionIds)&&v.optionIds[optionIndex]!=null&&String(v.optionIds[optionIndex])===String(value.id))));
   if(usableOptions.length){
     root.innerHTML=usableOptions.map(({option,optionIndex})=>{
       const optionValues=option.values.filter(value=>value&&value.id!=null&&value.title&&variants.some(v=>String(v.optionIds[optionIndex]??'')===String(value.id)));
       const selectedId=String(initial.optionIds[optionIndex]??optionValues[0]?.id??'');
       return '<label class="product-option-field">'+safe(option.name)+'<select data-printify-option="'+optionIndex+'" aria-label="'+safe(option.name)+'">'+optionValues.map(value=>'<option value="'+safe(value.id)+'" '+(String(value.id)===selectedId?'selected':'')+'>'+safe(value.title)+'</option>').join('')+'</select></label>';
     }).join('');
     // Keep only option selectors which have at least one matching variant.
     root.querySelectorAll('[data-printify-option]').forEach(select=>select.addEventListener('change',selectCurrentVariant));
     selectCurrentVariant();
   }else if(variants.length>1){
     root.innerHTML='<label class="product-option-field">Choose an option<select data-printify-variant aria-label="Choose product variant">'+variants.map((v,index)=>'<option value="'+Number(v.id)+'" '+(index===0?'selected':'')+'>'+safe(v.title)+' — '+money(v.priceCents)+'</option>').join('')+'</select></label>';
     root.querySelector('[data-printify-variant]').addEventListener('change',selectCurrentVariant);
     selectCurrentVariant();
   }else{
     selectedVariant=initial;
     $('product-price').textContent=money(initial.priceCents);
     $('product-buy').textContent='Add to Cart';$('product-buy').disabled=false;
     $('product-note').textContent='Choose your size/color, add the item to your cart, then request order confirmation and payment instructions.';
   }
 }
 function showError(message){$('product-status').textContent=message;$('product-status').hidden=false;$('product-panel').hidden=true;}
 function setImage(index){
   const image=images[index];if(!image)return;
   $('product-main-image').innerHTML='<img src="'+safe(image)+'" alt="'+safe($('product-title').textContent)+'" loading="eager">';
   $('product-main-image').dataset.image=image;
   $('product-lightbox-image').src=image;
   $('product-lightbox-image').alt=$('product-title').textContent;
   $('product-thumbs').querySelectorAll('button').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
 }
 function openLightbox(){if(!$('product-main-image').dataset.image)return;$('product-lightbox').classList.add('open');}
 $('product-main-image').addEventListener('click',openLightbox);
 $('product-lightbox').addEventListener('click',event=>{if(event.target===$('product-lightbox'))$('product-lightbox').classList.remove('open');});
 $('product-lightbox-close').addEventListener('click',()=>$('product-lightbox').classList.remove('open'));
 document.addEventListener('keydown',event=>{if(event.key==='Escape')$('product-lightbox').classList.remove('open');});
 async function load(){
   if(!slug||!/^[a-z0-9]+(?:-[a-z0-9]+)*$/i.test(slug)){showError('This product link is invalid. Return to the store to browse available products.');return;}
   try{
     const response=await fetch('/api/store/products?slug='+encodeURIComponent(slug),{credentials:'same-origin',cache:'no-store'});
     const data=await response.json().catch(()=>({}));
     if(!response.ok||!Array.isArray(data.products))throw new Error('We could not load this product right now. Please try again.');
     const product=data.products.find(item=>item.slug===slug);
     if(!product){showError('We couldn’t find that product. It may have been removed or is no longer available.');return;}
     selectedProduct=product;
     document.title=product.name+' | PokePrizePool Store';
     const description=String(product.description||'').trim();
     $('product-title').textContent=product.name||'Product';
     $('product-price').innerHTML=money(product.priceCents)+(Number(product.compareAtCents)>Number(product.priceCents)?'<span class="product-old-price">'+money(product.compareAtCents)+'</span>':'');
     $('product-badge').textContent=productIsComingSoon(product)?'Currently Unavailable':(product.preorder?'Available to Preorder':(product.manualOrderRequest?'Available to Request':(Number(product.available)>0?'In Stock':'Currently Unavailable')));
     $('product-description').textContent=description||'Product details are limited; contact PokePrizePool with questions.';
     const meta=[];
     if(product.category)meta.push(['Category',product.category==='merch'?'Clothing':product.category.charAt(0).toUpperCase()+product.category.slice(1)]);
     if(product.productType)meta.push(['Type',product.productType]);
     if(product.set)meta.push(['Set',product.set]);
     if(product.language)meta.push(['Language',product.language]);
     if(product.condition)meta.push(['Condition',product.condition]);
     if(product.gradeCompany)meta.push(['Grading company',product.gradeCompany]);
     if(product.grade)meta.push(['Grade',product.grade]);
     $('product-meta').innerHTML=meta.map(([label,value])=>'<div><strong>'+safe(label)+'</strong><span>'+safe(value)+'</span></div>').join('');
     images=Array.isArray(product.images)?product.images.filter(url=>typeof url==='string'&&/^https:\/\//i.test(url)):[];
     if(images.length){
       $('product-thumbs').innerHTML=images.map((image,index)=>'<button class="product-thumb" type="button" data-image-index="'+index+'" aria-label="View product image '+(index+1)+'" aria-pressed="'+(index===0?'true':'false')+'"><img src="'+safe(image)+'" alt="" loading="lazy"></button>').join('');
       setImage(0);
     }else{
       $('product-main-image').innerHTML='<span>No product image available yet</span>';
       $('product-main-image').style.cursor='default';
     }
     $('product-thumbs').addEventListener('click',event=>{const button=event.target.closest('[data-image-index]');if(button)setImage(Number(button.dataset.imageIndex));});
     if(product.isPrintify){
       renderVariantOptions(product);
       if(productIsComingSoon(product)){
         $('product-badge').textContent='Currently Unavailable';
         $('product-buy').textContent='Purchases Opening Soon';
         $('product-buy').disabled=true;
         $('product-note').textContent='This listing is active in the PokePrizePool store, but ordering is not available yet. Please check back later.';
       }else if(Number(product.available)>0){
         $('product-badge').textContent='Available · choose options';
         $('product-buy').addEventListener('click',()=>{
           if(!selectedVariant)return;
           location.href='/store.html?add='+encodeURIComponent(String(product.id))+'&variant='+encodeURIComponent(String(selectedVariant.id))+'&slug='+encodeURIComponent(String(product.slug||slug));
         });
       }else{
         $('product-badge').textContent='Currently Unavailable';
         $('product-buy').textContent='Currently Unavailable';
         $('product-buy').disabled=true;
       }
     }else if(productIsComingSoon(product)){$('product-buy').textContent='Purchases Opening Soon';$('product-note').textContent='This item is available to request through the PokePrizePool store. Availability is confirmed before the order is finalized.';}
     else if(Number(product.available)>0&&!product.externalCheckoutUrl){$('product-buy').textContent='Add to Cart';$('product-buy').disabled=false;$('product-note').textContent='Add this item to your cart. At checkout, request payment instructions directly from PokePrizePool. Singles, sealed products, graded cards, and accessories are pickup-only for now; do not send payment until we confirm the final total.';$('product-buy').addEventListener('click',()=>{location.href='/store.html?add='+encodeURIComponent(String(product.id))+'&slug='+encodeURIComponent(String(product.slug||slug));});}
     else{$('product-buy').textContent='Currently Unavailable';$('product-note').textContent='This product is not currently available to purchase.';}
     $('product-panel').hidden=false;$('product-status').hidden=true;
   }catch(error){showError(error.message||'We could not load this product right now.');}
 }
 load();
})();
</script>
</body>
</html>
