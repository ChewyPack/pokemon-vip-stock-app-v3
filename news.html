
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>News &amp; Exclusives | Pokémon VIP</title>
  <meta
    name="description"
    content="Pokémon TCG news and hobby updates from PokePrizePool."
  >

  <link rel="stylesheet" href="/css/styles.css">

  <style>
    html {
      min-height: 100%;
      background: #07142e;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: #fff;
      background-color: #07142e;
      background-image:
        linear-gradient(
          rgba(3, 10, 29, 0.76),
          rgba(3, 10, 29, 0.88)
        ),
        url("/assets/backgrounds/vip-collage.jpg");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: scroll;
    }

    .news-page {
      min-height: 100vh;
      background: transparent;
    }

    .news-content {
      position: relative;
      z-index: 1;
      width: min(1000px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 70px;
    }

    .news-content h1 {
      margin: 0;
      color: #fff;
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0.03em;
      text-shadow: 3px 3px 0 #0b2a6b;
    }

    .news-empty {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(5, 15, 40, 0.68);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .news-empty p {
      margin: 0;
      line-height: 1.6;
    }

    /* Keep the shared navigation above the page content. */
    #news-navigation {
      position: relative;
      z-index: 100;
    }

    @media (max-width: 560px) {
      .news-content {
        padding-top: 28px;
      }

      .news-empty {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="news-page">
    <div id="news-navigation"></div>

    <section
      class="news-content"
      aria-labelledby="news-title"
    >
      <h1 id="news-title">News &amp; Exclusives</h1>

      <div class="news-empty">
        <p>News stories will appear here.</p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      var root = document.getElementById('news-navigation');

      if (!root) {
        return;
      }

      function make(tag, attrs, children) {
        var node = document.createElement(tag);

        Object.keys(attrs || {}).forEach(function (key) {
          if (key === 'class') {
            node.className = attrs[key];
          } else {
            node.setAttribute(key, attrs[key]);
          }
        });

        (children || []).forEach(function (child) {
          if (child) {
            node.appendChild(child);
          }
        });

        return node;
      }

      function textElement(tag, attrs, value) {
        var node = make(tag, attrs);
        node.textContent = value;
        return node;
      }

      function link(label, href) {
        return textElement('a', {
          class: 'site-nav__link',
          href: href
        }, label);
      }

      function closeDropdowns(header) {
        header.querySelectorAll('.site-nav__toggle').forEach(function (button) {
          button.setAttribute('aria-expanded', 'false');
        });

        header.querySelectorAll('.site-nav__menu').forEach(function (menu) {
          menu.hidden = true;
        });
      }

      function dropdown(label, items) {
        var id = 'news-nav-' +
          label.toLowerCase().replace(/[^a-z0-9]+/g, '-');

        var button = textElement('button', {
          class: 'site-nav__toggle',
          type: 'button',
          'aria-expanded': 'false',
          'aria-controls': id
        }, label + ' ▾');

        var menu = make('div', {
          class: 'site-nav__menu',
          id: id
        });

        menu.hidden = true;

        items.forEach(function (item) {
          var children = [
            textElement('span', {
              class: 'site-nav__item-title'
            }, item.title)
          ];

          if (item.description) {
            children.push(
              textElement('span', {
                class: 'site-nav__item-description'
              }, item.description)
            );
          }

          menu.appendChild(
            make('a', {
              class: 'site-nav__item',
              href: item.href
            }, children)
          );
        });

        button.addEventListener('click', function () {
          var opening =
            button.getAttribute('aria-expanded') !== 'true';

          closeDropdowns(root);

          if (opening) {
            button.setAttribute('aria-expanded', 'true');
            menu.hidden = false;
          }
        });

        return make('div', {
          class: 'site-nav__dropdown'
        }, [button, menu]);
      }

      /*
       * Keep the same navigation structure as Home:
       * the brand is outside the nav, and the CTA is
       * the final direct child inside the nav.
       */
      var nav = make('nav', {
        class: 'site-nav',
        'aria-label': 'Main navigation'
      }, [
        link('Home', '/'),

        dropdown('Poke Report', [
          {
            title: 'Report a Sighting',
            description: 'Submit an in-store stock report',
            href: '/#report'
          },
          {
            title: 'News & Exclusives',
            description: 'Pokémon news and hobby updates',
            href: '/news.html'
          },
          {
            title: 'Market Intelligence',
            description: 'Market trends and product insights',
            href: '/market-intelligence.html'
          },
          {
            title: 'Events Calendar',
            description: 'Shows, trade nights, and releases',
            href: '/events.html'
          },
          ]),
          dropdown('Collectors', [
            { title: 'Collector Profiles', description: 'Browse collector profiles and collections', href: '/collector.html' },
            { title: 'Offer Inbox', description: 'Manage cash offers and collection trades', href: '/inbox.html' },
            { title: 'Account Settings', description: 'Profile, privacy, and nearby matching', href: '/account.html#nearby-collector-settings' }
          ]),

        /* Keep this inside .site-nav for the shared CTA styles. */
        link('Report a Sighting', '/#report')
      ]);

      var header = make('header', {
        class: 'site-nav-header'
      }, [
        make('div', {
          class: 'wrap site-nav-header__inner'
        }, [
          link('Pokémon VIP', '/'),
          nav
        ])
      ]);

      root.appendChild(header);

      document.addEventListener('click', function (event) {
        if (!header.contains(event.target)) {
          closeDropdowns(header);
        }
      });

      header.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeDropdowns(header);
        }
      });
    })();
  </script>
</body>
</html>
