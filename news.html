
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News & Exclusives | Pokémon VIP</title>
  <meta name="description" content="Pokémon TCG news and hobby updates from PokePrizePool.">
  <link rel="stylesheet" href="/css/styles.css">

  <style>
    html {
      min-height: 100%;
      background: #07142e;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: #fff;
      background:
        linear-gradient(rgba(3, 10, 29, .76), rgba(3, 10, 29, .88)),
        url("/assets/backgrounds/vip-collage.jpg") center center / cover fixed no-repeat;
    }

    .news-page {
      min-height: 100vh;
    }

    .news-content {
      width: min(1000px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 70px;
    }

    .news-content h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.1;
    }

    .news-empty {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 12px;
      background: rgba(5, 15, 40, .68);
    }

    .news-empty p {
      margin: 0;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="news-page">
    <div id="news-navigation"></div>

    <section class="news-content" aria-labelledby="news-title">
      <h1 id="news-title">News & Exclusives</h1>

      <div class="news-empty">
        <p>News stories will appear here.</p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var root = document.getElementById('news-navigation');

      function make(tag, attrs, children) {
        var node = document.createElement(tag);

        Object.keys(attrs || {}).forEach(function (key) {
          if (key === 'class') {
            node.className = attrs[key];
          } else {
            node.setAttribute(key, attrs[key]);
          }
        });

        (children || []).forEach(function (child) {
          if (child) node.appendChild(child);
        });

        return node;
      }

      function textElement(tag, attrs, value) {
        var node = make(tag, attrs);
        node.textContent = value;
        return node;
      }

      function link(label, href) {
        return textElement('a', {
          class: 'site-nav__link',
          href: href
        }, label);
      }

      function dropdown(label, items) {
        var id = 'nav-' + label.toLowerCase().replace(/[^a-z0-9]+/g, '-');

        var button = textElement('button', {
          class: 'site-nav__toggle',
          type: 'button',
          'aria-expanded': 'false',
          'aria-controls': id
        }, label + ' ▾');

        var menu = make('div', {
          class: 'site-nav__menu',
          id: id
        });
        menu.hidden = true;

        items.forEach(function (item) {
          var children = [
            textElement('span', {
              class: 'site-nav__item-title'
            }, item.title)
          ];

          if (item.description) {
            children.push(textElement('span', {
              class: 'site-nav__item-description'
            }, item.description));
          }

          menu.appendChild(make('a', {
            class: 'site-nav__item',
            href: item.href
          }, children));
        });

        button.addEventListener('click', function () {
          var opening = button.getAttribute('aria-expanded') !== 'true';

          root.querySelectorAll('.site-nav__toggle').forEach(function (other) {
            other.setAttribute('aria-expanded', 'false');
          });

          root.querySelectorAll('.site-nav__menu').forEach(function (other) {
            other.hidden = true;
          });

          if (opening) {
            button.setAttribute('aria-expanded', 'true');
            menu.hidden = false;
          }
        });

        return make('div', {
          class: 'site-nav__dropdown'
        }, [button, menu]);
      }

      var nav = make('nav', {
        class: 'site-nav',
        'aria-label': 'Main navigation'
      }, [
        link('Home', '/'),
        dropdown('Poke Report', [
          { title: 'Report a Sighting', description: 'Submit an in-store stock report', href: '/#report' },
          { title: 'News & Exclusives', description: 'Pokémon news and hobby updates', href: '/news.html' },
          { title: 'Market Intelligence', description: 'Market trends and product insights', href: '/market-intelligence.html' },
          { title: 'Events Calendar', description: 'Shows, trade nights, and releases', href: '/events.html' },
          { title: 'Vendor Directory', description: 'Discover vendors and their specialties', href: '/vendors.html' }
        ]),
        dropdown('Shop', [
          { title: 'Sealed Products', href: '/shop-sealed.html' },
          { title: 'Raw Singles', href: '/shop-singles.html' },
          { title: 'Graded Cards', href: '/shop-slabs.html' },
          { title: 'Merchandise', href: '/shop-merch.html' }
        ]),
        dropdown('Giveaways', [
          { title: 'My Entries', href: '/giveaway-entries.html' },
          { title: 'Giveaway Rules', href: '/giveaway-rules.html' },
          { title: 'Live Draws & Videos', href: '/giveaway-live.html' }
        ]),
        dropdown('Community', [
          { title: 'Discord Community', href: '/community-discord.html' },
          { title: 'Collector Resources', href: '/community-resources.html' },
          { title: 'VIP Badge Collection', href: '/vip-badges.html' },
          { title: 'Member Support', href: '/community-support.html' }
        ])
      ]);

      var header = make('header', {
        class: 'site-nav-header'
      }, [
        make('div', {
          class: 'wrap site-nav-header__inner'
        }, [
          link('Pokémon VIP', '/'),
          nav,
          link('Report a Sighting', '/#report')
        ])
      ]);

      root.appendChild(header);

      document.addEventListener('click', function (event) {
        if (!header.contains(event.target)) {
          header.querySelectorAll('.site-nav__toggle').forEach(function (button) {
            button.setAttribute('aria-expanded', 'false');
          });

          header.querySelectorAll('.site-nav__menu').forEach(function (menu) {
            menu.hidden = true;
          });
        }
      });

      header.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          header.querySelectorAll('.site-nav__toggle').forEach(function (button) {
            button.setAttribute('aria-expanded', 'false');
          });

          header.querySelectorAll('.site-nav__menu').forEach(function (menu) {
            menu.hidden = true;
          });
        }
      });
    })();
  </script>
</body>
</html>
