
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>News | PokePrizePool</title>
  <meta
    name="description"
    content="Pokémon TCG news and hobby updates from PokePrizePool."
  >

  <link rel="stylesheet" href="/css/styles.css">

  <style>
    html {
      min-height: 100%;
      background: #07142e;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: #fff;
      background-color: #07142e;
      background-image:
        linear-gradient(
          rgba(3, 10, 29, 0.76),
          rgba(3, 10, 29, 0.88)
        ),
        url("/assets/backgrounds/vip-collage.jpg");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: scroll;
    }

    .news-page {
      min-height: 100vh;
      background: transparent;
    }

    .news-content {
      position: relative;
      z-index: 1;
      width: min(1000px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 70px;
    }

    .news-content h1 {
      margin: 0;
      color: #fff;
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0.03em;
      text-shadow: 3px 3px 0 #0b2a6b;
    }

    .news-empty {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(5, 15, 40, 0.68);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .news-empty p {
      margin: 0;
      line-height: 1.6;
    }

    .news-story-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
    .news-story-card{overflow:hidden;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(5,15,40,.78)}
    .news-story-card img{display:block;width:100%;max-height:240px;aspect-ratio:16/9;object-fit:cover;background:#0b204a}
    .news-story-card__body{padding:18px}
    .news-story-meta{font-size:.82rem;color:#b9c9e8;text-transform:uppercase;letter-spacing:.08em}
    .news-story-card h2{font-size:1.35rem;line-height:1.25;margin:10px 0;color:#fff}
    .news-story-card p{line-height:1.65;color:#e0e8f7;white-space:pre-line}
    .news-read-link{display:inline-block;margin-top:8px;color:#9ec7ff;font-weight:700;text-decoration:underline}
    .news-article-panel{margin-top:8px;padding:clamp(20px,4vw,36px);border-radius:14px;background:#fff;color:#202633;box-shadow:0 8px 28px rgba(0,0,0,.18)}
    .news-article-panel .news-story-meta{color:#5d687a}
    .news-article-panel p{color:#303847;line-height:1.75}
    .news-article-content{white-space:pre-line;line-height:1.85;font-size:1.04rem;color:#202633}.news-article-content p{margin:0 0 1.1em;color:inherit;white-space:pre-line}
    .news-article-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:22px 0}
    .news-article-image{display:block;width:100%;height:280px;max-height:480px;object-fit:cover;border-radius:10px;background:#eef2f8}
    .news-photo-count{font-size:.78rem!important;color:#9ec7ff!important;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    .news-back-link{display:inline-block;margin:0 0 18px;color:#a8caff}
    .news-share{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:18px 0 24px;padding:14px 0;border-top:1px solid #e1e6ef;border-bottom:1px solid #e1e6ef}.news-share__label{flex-basis:100%;margin:0;color:#5d687a;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.news-share a,.news-share button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 13px;border:1px solid #cbd5e1;border-radius:8px;background:#f4f7fb;color:#17233b;font:inherit;font-size:.88rem;font-weight:700;line-height:1.2;text-decoration:none;cursor:pointer}.news-share a:hover,.news-share button:hover{background:#e5edf8;border-color:#8da8d2}.news-share__status{flex-basis:100%;min-height:1.2em;margin:0;color:#526079;font-size:.82rem}
\n    /* Keep the shared navigation above the page content. */
    #news-navigation {
      position: relative;
      z-index: 100;
    }

    @media (max-width: 560px) {
      .news-content {
        padding-top: 28px;
      }

      .news-empty {
        padding: 16px;
      }
      .news-article-gallery{grid-template-columns:1fr}
      .news-article-image{height:auto;aspect-ratio:16/10}
    }
    .news-x-embed{margin:18px 0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}
    .news-x-embed .twitter-tweet{margin:0 auto!important;max-width:550px}
    .news-x-embed-fallback{font-size:.9rem;color:#cfe3ff}
    .news-x-embed-fallback a{color:#ffd21f;font-weight:800}
    .news-x-embed-fallback[hidden]{display:none!important}
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body>
  <main class="news-page">
    <div id="site-navigation"></div>

    <section
      class="news-content"
      aria-labelledby="news-title"
    >
      <h1 id="news-title">News</h1>

      <div id="news-stories">
        <div class="news-empty">
          <p>Loading the latest stories…</p>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/ui/site-nav.js?v=20261026-marketplace-menu-cleanup-v1"></script>
  <script>
    (function(){
      'use strict';
      var container=document.getElementById('news-stories');
      var heading=document.getElementById('news-title');
      if(!container||!heading)return;
      function add(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
      function dateLabel(value){if(!value)return '';var d=new Date(value);return isNaN(d.getTime())?value:d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}
      function api(url){return fetch(url,{credentials:'omit',cache:'no-store'}).then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok||!d.ok)throw new Error(d.error||'Could not load stories');return d;});});}
      function renderList(stories){
        container.replaceChildren();
        if(!stories.length){container.appendChild(add('p','', 'No stories have been published yet. Check back soon.'));return;}
        var grid=add('div','news-story-list');
        stories.forEach(function(story){
          var card=add('article','news-story-card');
          if(story.image_url){var img=add('img','');img.src=story.image_url;img.alt='';img.loading='lazy';img.onerror=function(){img.remove();};card.appendChild(img);}
          var body=add('div','news-story-card__body');
          body.appendChild(add('div','news-story-meta',[story.category,dateLabel(story.published_at)].filter(Boolean).join(' · ')));
          body.appendChild(add('h2','',story.title));
          if(story.excerpt)body.appendChild(add('p','',story.excerpt));
          if(Array.isArray(story.image_urls)&&story.image_urls.length>1)body.appendChild(add('p','news-photo-count',story.image_urls.length+' photos in this article'));
          var link=add('a','news-read-link','Read story →');link.href='/news.html?story='+encodeURIComponent(story.slug);body.appendChild(link);
          card.appendChild(body);grid.appendChild(card);
        });
        container.appendChild(grid);
      }
      function validXPostUrl(value){
        try{
          var url=new URL(String(value||'').trim());
          if(url.protocol!=='https:'||!['x.com','www.x.com','twitter.com','www.twitter.com'].includes(url.hostname.toLowerCase()))return '';
          var match=url.pathname.match(/^\/(?:([A-Za-z0-9_]{1,15})\/status\/(\d+)|i\/web\/status\/(\d+))\/?$/);
          if(!match)return '';
          return 'https://x.com'+(match[3]?'/i/web/status/'+match[3]:'/'+match[1]+'/status/'+match[2]);
        }catch(_){return '';}
      }
      function addXPostEmbed(panel,value){
        var url=validXPostUrl(value);if(!url)return;
        var block=add('section','news-x-embed');
        var quote=document.createElement('blockquote');quote.className='twitter-tweet';
        var link=document.createElement('a');link.href=url;link.textContent='View this post on X';quote.appendChild(link);block.appendChild(quote);
        var fallback=add('p','news-x-embed-fallback',''); fallback.hidden=true;
        var fallbackLink=add('a','', 'Open post on X');fallbackLink.href=url;fallbackLink.target='_blank';fallbackLink.rel='noopener noreferrer';fallback.appendChild(document.createTextNode(' '));fallback.appendChild(fallbackLink);block.appendChild(fallback);
        panel.appendChild(block);
        if(window.twttr&&window.twttr.widgets&&typeof window.twttr.widgets.load==='function'){
          window.twttr.widgets.load(block);
          return;
        }
        var script=document.querySelector('script[data-ppp-x-widgets]');
        if(!script){
          script=document.createElement('script');script.src='https://platform.x.com/widgets.js';script.async=true;script.charset='utf-8';script.dataset.pppXWidgets='true';
          script.onload=function(){if(window.twttr&&window.twttr.widgets)window.twttr.widgets.load(block);};
          script.onerror=function(){fallback.hidden=false;};
          document.body.appendChild(script);
        }else{
          var attempts=0;
          var retry=function(){attempts++;if(window.twttr&&window.twttr.widgets)window.twttr.widgets.load(block);else if(attempts<12)window.setTimeout(retry,250);};
          retry();
        }
      }
      function renderStory(story){
        heading.textContent=story.title;
        document.title=String(story.title||'News')+' | PokePrizePool';
        container.replaceChildren();
        var back=add('a','news-back-link','← All News');back.href='/news.html';container.appendChild(back);
        var panel=add('article','news-article-panel');
        panel.appendChild(add('div','news-story-meta',[story.category,dateLabel(story.published_at)].filter(Boolean).join(' · ')));
        var share=add('div','news-share');share.setAttribute('aria-label','Share this story');
        share.appendChild(add('p','news-share__label','Share this story'));
        var shareUrl='https://pokeprizepool.com/news?story='+encodeURIComponent(story.slug);
        var shareTitle=String(story.title||'PokePrizePool news');
        function shareLink(label,url){var a=add('a','',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';share.appendChild(a);}
        shareLink('Facebook','https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(shareUrl));
        shareLink('X','https://twitter.com/intent/tweet?url='+encodeURIComponent(shareUrl)+'&text='+encodeURIComponent(shareTitle));
        shareLink('WhatsApp','https://wa.me/?text='+encodeURIComponent(shareTitle+' '+shareUrl));
        var copyButton=add('button','','Copy link');copyButton.type='button';
        var shareStatus=add('p','news-share__status','');shareStatus.setAttribute('aria-live','polite');
        copyButton.addEventListener('click',function(){
          if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(shareUrl).then(function(){shareStatus.textContent='Story link copied.';}).catch(function(){shareStatus.textContent='Copy was blocked by your browser. Copy the page address from your browser bar.';});}
          else{shareStatus.textContent='Copy the story address from your browser bar.';}
        });
        share.appendChild(copyButton);
        if(typeof navigator.share==='function'){
          var nativeButton=add('button','','More sharing options');nativeButton.type='button';
          nativeButton.addEventListener('click',function(){navigator.share({title:shareTitle,text:shareTitle,url:shareUrl}).catch(function(error){if(error&&error.name!=='AbortError')shareStatus.textContent='Could not open the share menu.';});});
          share.appendChild(nativeButton);
        }
        panel.appendChild(share);
        var imageUrls=Array.isArray(story.image_urls)?story.image_urls.slice(0,3):(story.image_url?[story.image_url]:[]);
        if(imageUrls.length){
          var gallery=add('div','news-article-gallery');
          gallery.dataset.count=String(imageUrls.length);
          imageUrls.forEach(function(url,index){
            var img=add('img','news-article-image');
            img.src=url;
            img.alt=story.title+' — image '+(index+1)+' of '+imageUrls.length;
            img.loading=index===0?'eager':'lazy';
            img.onerror=function(){img.remove();if(!gallery.children.length)gallery.remove();};
            gallery.appendChild(img);
          });
          panel.appendChild(gallery);
        }
        if(story.excerpt)panel.appendChild(add('p','',story.excerpt));
        var articleContent=add('div','news-article-content');
        var marker='{{X_POST_EMBED}}';
        var parts=String(story.content||'').split(marker);
        parts.forEach(function(part,index){
          if(part)articleContent.appendChild(add('p','',part));
          if(index<parts.length-1){
            panel.appendChild(articleContent);
            articleContent=add('div','news-article-content');
            addXPostEmbed(panel,story.x_post_url);
          }
        });
        if(articleContent.childNodes.length||parts.length===1)panel.appendChild(articleContent);
        if(!String(story.content||'').includes(marker))addXPostEmbed(panel,story.x_post_url);
        container.appendChild(panel);
      }
      var slug=new URLSearchParams(location.search).get('story');
      if(slug){
        api('/api/news?slug='+encodeURIComponent(slug)).then(function(data){renderStory(data.story);}).catch(function(){heading.textContent='News';container.replaceChildren(add('p','', 'That story could not be found or is no longer published.'),Object.assign(add('a','news-back-link','← Back to News'),{href:'/news.html'}));});
      }else{
        api('/api/news?category=News').then(function(data){renderList(data.stories||[]);}).catch(function(){container.replaceChildren(add('p','', 'We could not load the latest stories right now. Please try again soon.'));});
      }
    })();
  </script>
<script src="/js/ui/pokereport-sidebar.js"></script>
</body>
</html>
