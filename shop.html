<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06174A"><title>Collector Shop | PokePrizePool</title><link rel="stylesheet" href="/css/styles.css"><style>
.shop-wrap{width:min(1120px,calc(100% - 28px));margin:28px auto 70px;color:#0b2a6b}.shop-hero{background:#fff;border:3px solid #0b2a6b;border-radius:16px;overflow:hidden;box-shadow:7px 7px 0 #000}.shop-cover{height:220px;background:#e8efff center/cover no-repeat}.shop-head{padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}.shop-logo{width:100px;height:100px;object-fit:cover;border:3px solid #0b2a6b;border-radius:14px;background:#fff}.shop-title{font:400 clamp(2rem,5vw,3rem)/1.05 var(--font-display);margin:0}.shop-bio{line-height:1.6;white-space:pre-wrap}.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:24px}.shop-card{background:#fff;border:2px solid #0b2a6b;border-radius:12px;padding:12px;box-shadow:4px 4px 0 #000;min-width:0}.shop-image{width:100%;height:190px;object-fit:contain;background:#f4f7ff;border-radius:8px}.shop-card h2{font-size:1.05rem;margin:10px 0 5px;overflow-wrap:anywhere}.shop-muted{color:#52648b;line-height:1.5}.shop-price{font-size:1.25rem;font-weight:900;margin:8px 0}.shop-empty{padding:24px;background:#fff;border:2px solid #d5e0f2;border-radius:12px}@media(max-width:600px){.shop-cover{height:150px}.shop-logo{width:78px;height:78px}}
</style>  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head><body><div id="site-navigation"></div><main class="shop-wrap"><p><a href="/collector.html">← Collector profiles</a></p><section class="shop-hero"><div id="cover" class="shop-cover"></div><div class="shop-head"><img id="logo" class="shop-logo" alt="Shop logo" hidden><div><h1 id="shop-name" class="shop-title">Loading shop…</h1><p id="shop-owner" class="shop-muted"></p></div></div><div style="padding:0 20px 20px"><p id="shop-bio" class="shop-bio"></p><p id="shop-links"></p></div></section><p id="shop-status" class="shop-muted" role="status" aria-live="polite">Loading shop listings…</p><section id="shop-items" class="shop-grid"></section></main><script src="/js/ui/site-nav.js"></script><script>
(async()=>{const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const user=new URLSearchParams(location.search).get('user')||'';if(!user){$('shop-status').textContent='Open a shop from a collector profile link.';return;}try{const r=await fetch('/api/vendor/shop?user='+encodeURIComponent(user),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error('Could not load this shop right now.');if(!d.shop){$('shop-name').textContent='No public shop yet';$('shop-owner').textContent='This collector has not published a public shop profile yet.';$('shop-status').textContent='';return;}const s=d.shop;$('shop-name').textContent=s.shop_name||'Vendor Shop';$('shop-owner').innerHTML='Shop by <a href="/collector.html?user='+encodeURIComponent(s.username)+'">@'+safe(s.username)+'</a>';$('shop-bio').textContent=s.bio||'';if(s.logo_key){$('logo').src='/api/vendor/image?key='+encodeURIComponent(s.logo_key);$('logo').hidden=false;}if(s.cover_key)$('cover').style.backgroundImage='url("/api/vendor/image?key='+encodeURIComponent(s.cover_key)+'")';const links=[];if(s.website_url&&/^https:\/\//i.test(s.website_url))links.push('<a rel="noopener noreferrer" target="_blank" href="'+safe(s.website_url)+'">Website</a>');if(s.social_links&&/^https:\/\//i.test(s.social_links))links.push('<a rel="noopener noreferrer" target="_blank" href="'+safe(s.social_links)+'">Social profile</a>');$('shop-links').innerHTML=links.join(' · ');const items=d.items||[];$('shop-status').textContent=items.length?items.length+' listing'+(items.length===1?'':'s')+' available.':'This vendor has not listed items for sale yet.';$('shop-items').innerHTML=items.map(i=>'<article class="shop-card">'+(i.image_url?'<img class="shop-image" alt="'+safe(i.item_name)+'" src="'+safe(i.image_url)+'">':'<div class="shop-image"></div>')+'<h2>'+safe(i.item_name)+'</h2><p class="shop-muted">'+safe(i.category)+(i.condition_label?' · '+safe(i.condition_label):'')+'</p>'+(i.price_cents!=null?'<p class="shop-price">$'+(Number(i.price_cents)/100).toFixed(2)+'</p>':'<p class="shop-muted">Contact vendor for price</p>')+(i.quantity_hint?'<p class="shop-muted">'+safe(i.quantity_hint)+'</p>':'')+(i.notes?'<p class="shop-muted">'+safe(i.notes)+'</p>':'')+'</article>').join('');}catch(e){$('shop-status').textContent=e.message||'Could not load shop.';}})();
</script></body></html>
