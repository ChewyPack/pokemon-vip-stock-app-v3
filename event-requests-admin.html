<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Show Buyer Requests Admin</title><style>
body{margin:0;background:#0b0e17;color:#f2f5fb;font:14px/1.5 system-ui,sans-serif}main{padding:14px}h1{font-size:22px;margin:0 0 8px}.muted{color:#aab4c7}button{cursor:pointer;border:1px solid #39465f;border-radius:8px;padding:8px 11px;background:#202a3e;color:#fff;font:inherit}.danger{background:#4a2027;border-color:#7a333b}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.status{color:#ffe39a}.item{border:1px solid #293248;background:#141a29;border-radius:12px;padding:14px;margin:12px 0}.item p{margin:6px 0}.tag{display:inline-block;border:1px solid #39465f;border-radius:99px;padding:2px 8px;margin-right:4px}.responses{border-top:1px solid #293248;margin-top:10px;padding-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}</style></head><body><main><div class="top"><div><h1>Show Buyer Requests</h1><p class="muted">Review requests across events, close requests, or remove spam. Admin only.</p></div><button id="refresh">Refresh</button></div><p id="status" class="status" role="status" aria-live="polite">Loading…</p><div id="list"></div></main><script>
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function money(c){return c==null?'Not set':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(c)/100);}
async function api(url,opts){const r=await fetch(url,{credentials:'include',cache:'no-store',...opts});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.message||d.error||'Request failed');return d;}
async function act(item,action){if(action==='admin_delete'&&!confirm('Permanently delete this buyer request and all vendor responses?'))return;try{await api('/api/event-buyer-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,event_id:Number(item.event_id),request_id:Number(item.id),status:'closed'})});await load();}catch(e){$('status').textContent=e.message;}}
async function load(){ $('status').textContent='Loading requests…';try{const d=await api('/api/event-buyer-requests?admin=1');const list=$('list');if(!d.requests.length){list.innerHTML='<p class="muted">No requests found.</p>';}else{list.innerHTML=d.requests.map(r=>'<article class="item"><div><strong>'+esc(r.event_title||'Event')+'</strong> · '+esc(r.event_date||'')+'</div><h2>'+esc(r.title)+'</h2><p>'+esc(r.details||'No extra details')+'</p><p><span class="tag">'+esc(r.product_type)+'</span><span class="tag">Qty '+Number(r.quantity)+'</span><span class="tag">Budget '+esc(money(r.max_budget_cents))+'</span><span class="tag">'+esc(r.status)+'</span></p><p class="muted">Buyer: '+esc(r.buyer_name)+' · '+esc(r.created_at)+'</p><div class="responses">'+(r.responses||[]).map(p=>'<p><strong>'+esc(p.vendor_name)+'</strong> · '+esc(money(p.price_cents))+' · Booth '+esc(p.booth_location||'not listed')+' · '+esc(p.status)+'</p>').join('')+'</div><div class="actions">'+(r.status==='open'?'<button data-close="'+r.id+'" data-event="'+r.event_id+'">Close request</button>':'')+'<button class="danger" data-delete="'+r.id+'" data-event="'+r.event_id+'">Delete request</button></div></article>').join('');list.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',async()=>{try{await api('/api/event-buyer-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'close',event_id:Number(b.dataset.event),request_id:Number(b.dataset.close),status:'closed'})});await load();}catch(e){$('status').textContent=e.message;}}));list.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>act({id:b.dataset.delete,event_id:b.dataset.event},'admin_delete')));} $('status').textContent='Loaded '+d.requests.length+' request(s).';}catch(e){$('status').textContent=e.message;}}
$('refresh').addEventListener('click',load);load();
</script></body></html>
