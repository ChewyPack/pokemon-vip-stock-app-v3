<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Securing Product | PokePrizePool</title>
<meta name="description" content="PokePrizePool Securing Product field guide for eligible members.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/site-nav.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#07142e;color:#e8ecf5;font:16px/1.6 Barlow,system-ui,sans-serif}
.loading-wrap{width:min(760px,calc(100% - 32px));margin:64px auto}
.loading-card{padding:clamp(24px,5vw,48px);border:1px solid #293852;border-radius:20px;background:linear-gradient(145deg,#101b31,#10141f);box-shadow:0 20px 60px #0004}
.eyebrow{color:#ffcb05;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.78rem}
h1{margin:10px 0 16px;font:800 clamp(2.3rem,7vw,4.2rem)/1.02 'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;color:#fff}
p{color:#b8c5dc}
</style>
</head>
<body>
<div id="site-navigation"></div>
<main class="loading-wrap"><section class="loading-card" aria-live="polite" aria-busy="true">
<p class="eyebrow">PokePrizePool Field Guide</p>
<h1>Checking Membership</h1>
<p id="access-message">Verifying your account before loading Securing Product…</p>
</section></main>
<script>
(function(){
'use strict';
var message=document.getElementById('access-message');
fetch('/api/securing-product',{method:'GET',credentials:'include',cache:'no-store',headers:{'Accept':'text/html'}})
.then(function(response){return response.text();})
.then(function(markup){
  document.open();
  document.write(markup);
  document.close();
})
.catch(function(){
  document.querySelector('.loading-card').setAttribute('aria-busy','false');
  document.querySelector('h1').textContent='Unable to Check Membership';
  message.textContent='We could not verify your access right now. Please refresh this page or try again later.';
});
})();
</script>
<script src="/js/ui/site-nav.js?v=20261026-marketplace-menu-cleanup-v1"></script>
</body>
</html>
