<div id="site-navigation"></div>
<main class="community-wrap">

<section id="community-feed">
<form class="social-composer" data-social-composer hidden>
  <div class="composer-brand"><img src="/pokeprizepool-pwa-192.png?v=4" alt="PokePrizePool logo"></div>
  <label class="composer-prompt" for="community-post-body">What’s happening in your collection?</label>
  <textarea id="community-post-body" name="body" maxlength="2000" rows="4" placeholder="Share a pull, a thought, a question, or a new find…"></textarea>
  <div class="composer-tools">
    <div class="composer-upload-tools">
      <label class="composer-upload composer-photo" for="community-post-images"><span class="composer-upload-icon">▧</span><span><strong>Add photos</strong><small>Up to 3 · 5 MB each</small></span><input id="community-post-images" name="images" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple></label>
      <label class="composer-upload composer-video" for="community-post-video"><span class="composer-upload-icon">▶</span><span><strong>Add video</strong><small>MP4/WebM · 25 MB max</small></span><input id="community-post-video" name="video" type="file" accept="video/mp4,video/webm"></label>
    </div>
    <button class="social-primary composer-submit" type="submit"><span>Post to feed</span><span aria-hidden="true">→</span></button>
  </div>
  <div class="social-media-preview" data-media-preview aria-live="polite"></div>
  <p class="social-inline-status" data-composer-status role="status" aria-live="polite"></p>
</form>
<div class="community-filter">
<select id="community-feed-sort" aria-label="Sort community feed">
<option value="latest" selected>Most recent</option>
<option value="for-you">Most relevant</option>
<option value="following">Recent activity</option>
</select>
</div>
<p class="social-inline-status" data-social-feed-status role="status" aria-live="polite">Loading community posts…</p>
<div data-social-post-list></div>
<p class="social-inline-status">Please keep posts respectful. Use Report on a post to flag spam, scams, harassment, or other concerns.</p>
</section>
</main>
<script src="/js/ui/collector-social.js?v=20261029-post-menu-edit-1"></script>
<script src="/js/ui/site-nav.js?v=20261028-live-profile-rings-v1"></script>
</body>
</html>
