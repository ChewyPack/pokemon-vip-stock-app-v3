<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06174A">
<title>Offer Inbox | PokePrizePool</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css">
<style>
body{min-height:100vh;margin:0;background:#eef3ff;color:#07194d;font-family:Nunito,system-ui,sans-serif}.inbox-main{width:min(1050px,calc(100% - 28px));margin:30px auto 70px}.inbox-hero{padding:clamp(20px,4vw,34px);border:3px solid #0b2a6b;border-radius:16px;background:#fff;box-shadow:6px 6px 0 #07194d;margin-bottom:18px}.inbox-hero h1{font:400 clamp(2rem,5vw,3rem)/1.05 Bangers,cursive;margin:0 0 8px;color:#0b2a6b}.inbox-hero p{margin:0;color:#4b5f8f;line-height:1.6}.inbox-tools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0}.inbox-tabs{display:flex;gap:8px;flex-wrap:wrap}.inbox-tabs button,.inbox-btn{min-height:42px;border:2px solid #0b2a6b;border-radius:9px;padding:9px 13px;background:#eaf4ff;color:#0b2a6b;font:inherit;font-weight:900;cursor:pointer}.inbox-tabs button[aria-pressed=true],.inbox-btn.primary{background:#ffd21f}.inbox-btn:disabled{opacity:.55;cursor:wait}.inbox-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.offer-card{min-width:0;border:2px solid #d5e0f2;border-radius:13px;padding:16px;background:#fff;box-shadow:0 4px 14px #07194d0a}.offer-card h2{font:400 1.45rem/1.15 Bangers,cursive;margin:0 0 9px;color:#0b2a6b;overflow-wrap:anywhere}.offer-card p{font-size:.91rem;color:#334a7c;line-height:1.55;overflow-wrap:anywhere;margin:6px 0}.offer-card .offer-status{display:inline-flex;padding:5px 9px;border-radius:99px;background:#fff3b3;color:#604900;font-size:.78rem;font-weight:900;text-transform:capitalize}.offer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.offer-empty{grid-column:1/-1;padding:26px;border:2px dashed #b9c9e6;border-radius:12px;text-align:center;color:#4b5f8f;background:#fff;line-height:1.6}.inbox-status{min-height:24px;color:#31517f;line-height:1.5}.offer-card a{color:#174b9b;font-weight:900}@media(max-width:680px){.inbox-list{grid-template-columns:1fr}.inbox-main{margin-top:20px}}
.inbox-hero h1{display:flex;align-items:center;gap:12px}.inbox-hero-icon{width:42px;height:42px;object-fit:contain;flex:0 0 auto}@media(max-width:560px){.inbox-hero-icon{width:34px;height:34px}}
</style>
</head>
<body>
<div id="site-navigation"></div>
<main class="inbox-main">
<header class="inbox-hero"><h1><img class="inbox-hero-icon" src="/inbox-icon.png" alt="" width="42" height="42"> Offer Inbox</h1><p>Manage cash offers and collection trades in one place. Accepting an offer does not process payment or automatically transfer items.</p></header>
<div class="inbox-tools"><div class="inbox-tabs" role="group" aria-label="Filter offers"><button type="button" data-filter="all" aria-pressed="true">All offers</button><button type="button" data-filter="incoming" aria-pressed="false">Received</button><button type="button" data-filter="outgoing" aria-pressed="false">Sent</button></div><button class="inbox-btn" id="refresh-offers" type="button">↻ Refresh</button></div>
<p class="inbox-status" id="inbox-status" role="status" aria-live="polite">Loading offers…</p><section class="inbox-list" id="inbox-list" aria-label="Offers"></section>
</main>
<script src="/js/ui/site-nav.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);let offers=[],filter='all';
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=cents=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(cents||0)/100);
const itemLabel=i=>[i.product_name,i.set_name,i.card_number?'#'+i.card_number:'',i.product_type==='sealed'?'Sealed product':i.product_type==='graded'?'Graded card':'Single card'].filter(Boolean).join(' · ');
async function api(url,options={}){const r=await fetch(url,{credentials:'include',cache:'no-store',...options,headers:{...(options.headers||{}),...(options.body?{'Content-Type':'application/json'}:{})}});const d=await r.json().catch(()=>({ok:false,error:'bad_response'}));if(r.status===401){location.href='/account.html';throw new Error('Please sign in to your collector account.');}if(!r.ok||!d.ok)throw new Error(d.error||'Request failed');return d;}
function render(){const visible=offers.filter(o=>filter==='all'||o.direction===filter);if(!visible.length){$('inbox-list').innerHTML='<div class="offer-empty">'+(filter==='incoming'?'You have not received any offers yet.':filter==='outgoing'?'You have not sent any offers yet.':'Your inbox is clear. Cash offers and trade offers will appear here when sent or received.')+'</div>';return;}
$('inbox-list').innerHTML=visible.map(o=>{const incoming=o.direction==='incoming',other=incoming?o.proposer_username:o.recipient_username,isCash=o.offer_type==='cash',parts=(o.items||[]).map(i=>(i.side==='offering'?'Offers: ':'Requests: ')+itemLabel(i)+' × '+Number(i.quantity||1)).join(' · ');let actions='';if(o.status==='pending'&&incoming)actions='<button class="inbox-btn primary" data-action="accept" data-id="'+Number(o.id)+'">Accept</button><button class="inbox-btn" data-action="decline" data-id="'+Number(o.id)+'">Decline</button>';if(o.status==='pending'&&!incoming)actions='<button class="inbox-btn" data-action="cancel" data-id="'+Number(o.id)+'">Cancel offer</button>';if(o.status==='accepted')actions='<button class="inbox-btn primary" data-action="complete" data-id="'+Number(o.id)+'">Confirm '+(isCash?'transaction':'trade')+' complete</button>';return '<article class="offer-card"><h2>'+(isCash?'💵 Cash Offer':'🔁 Trade Offer')+' · '+(incoming?'From ':'To ')+'<a href="/collector.html?user='+encodeURIComponent(other)+'">@'+safe(other)+'</a></h2>'+(isCash?'<p><strong>Offer amount: '+money(o.cash_amount_cents)+'</strong></p>':'<p>'+safe(parts||'No item details provided')+'</p>')+(o.message?'<p><strong>Message:</strong> '+safe(o.message)+'</p>':'')+'<p><span class="offer-status">'+safe(o.status)+'</span></p><p><small>'+safe(o.created_at||'')+'</small></p>'+(actions?'<div class="offer-actions">'+actions+'</div>':'')+'</article>';}).join('');}
async function load(){ $('inbox-status').textContent='Loading offers…';try{const d=await api('/api/collector/trades');offers=d.offers||[];render();$('inbox-status').textContent=offers.length?offers.length+' offer'+(offers.length===1?'':'s')+' total.':'No offers yet.';}catch(e){$('inbox-status').textContent=e.message;$('inbox-list').innerHTML='';}}
$('refresh-offers').addEventListener('click',load);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}));
$('inbox-list').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;b.disabled=true;$('inbox-status').textContent='Updating offer…';try{const d=await api('/api/collector/trades',{method:'PATCH',body:JSON.stringify({id:Number(b.dataset.id),action:b.dataset.action})});$('inbox-status').textContent=d.waiting_for_other?'Your confirmation is recorded. Waiting for the other member.':'Offer updated: '+d.status+'.';await load();}catch(err){$('inbox-status').textContent=err.message;b.disabled=false;}});
load();
})();
</script>
</body>
</html>
