<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pokémon VIP | Report a Stock Sighting</title>
    <meta name="description" content="See Pokémon cards in a store? Report it in under a minute and the VIP Discord gets the alert." />
    <meta name="theme-color" content="#06174A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-view="home">
    <div class="bg-speed" aria-hidden="true"></div>
    <main id="app">
      <section id="view-home" class="view"></section>
      <section id="view-form" class="view" hidden></section>
      <section id="view-done" class="view" hidden></section>
      <noscript><p class="wrap" style="padding:32px 0">This app needs JavaScript to run. Please turn it on and reload.</p></noscript>
    </main>

    <!-- Shared rules (also used by the server) -->
    <script src="js/shared/form-config.js"></script>
    <script src="js/shared/validate.js"></script>
    <!-- Configuration -->
    <script src="js/config/site-config.js"></script>
    <script src="js/config/assets.js"></script>
    <!-- Services -->
    <script src="js/services/draft.js"></script>
    <script src="js/services/image-tools.js"></script>
    <script src="js/services/submit.js"></script>
    <!-- UI -->
    <script src="js/ui/dom.js"></script>
    <script src="js/ui/effects.js"></script>
    <script src="js/ui/fields.js"></script>
    <script src="js/ui/landing.js"></script>
    <script src="js/ui/flow.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
